<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>AGRSOFT SOLUTIONS</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='style.css') }}"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    />
  </head>

  <body>
    <!-- NAVBAR -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark px-3">
      <a class="navbar-brand fw-bold" href="{{ url_for('home') }}"
        >AGRSOFT SOLUTIONS</a
      >

      <button
        class="navbar-toggler"
        type="button"
        data-bs-toggle="collapse"
        data-bs-target="#nav"
      >
        <span class="navbar-toggler-icon"></span>
      </button>

      <div class="collapse navbar-collapse" id="nav">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item">
            <a class="nav-link" href="{{ url_for('home') }}">Home</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="{{ url_for('dynamics365') }}"
              >Dynamics 365</a
            >
          </li>
          <li class="nav-item">
            <a class="nav-link" href="{{ url_for('powerplatforms') }}"
              >Power Platforms</a
            >
          </li>
          <li class="nav-item">
            <a class="nav-link" href="{{ url_for('services') }}">Services</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="{{ url_for('industries') }}"
              >Industries</a
            >
          </li>
          <li class="nav-item">
            <a class="nav-link" href="{{ url_for('contact') }}">Contact</a>
          </li>
        </ul>
      </div>
    </nav>
    <!-- PAGE CONTENT -->
    <div>{% block content %}{% endblock %}</div>

    <!-- FOOTER -->
    <footer class="bg-dark text-white text-center p-4 mt-5">
      <p class="mb-1">© 2026 AGRSOFT SOLUTIONS</p>
      <small>Driving innovation and success, one project at a time.</small>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
